# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  scripts: ./scripts/Taskfile.yml
  gh: ./.github/Taskfile.yml
  hooks: ./.husky/Taskfile.yml

tasks:
  default:
    cmds:
      - task --list
    silent: true

  sync:
    desc: Copy shared info from metadata.json into package.json, pyproject.toml and lockfiles
    cmds:
      - task: scripts:sync

  test:
    desc: Run checks
    cmds:
      - task: scripts:sync:check

  lint:
    desc: Lint workflows and delegated scripts
    cmds:
      - task: gh:lint
      - task: scripts:lint

  commit:
    desc: Commit with commitizen (conventional message prompt)
    interactive: true
    cmds:
      - uv run cz commit

  bump:
    desc: Bump version, changelog and tag (CI does this on every merge into master, don't run it by hand there)
    cmds:
      - uv run cz bump {{.CLI_ARGS}}

  install:
    desc: Install npm and uv dependencies (shakespeare-gui is linked from ../shakespeare-gui)
    cmds:
      - npm install
      - uv sync

  gui:
    desc: Build the shakespeare-gui plugin this app depends on
    dir: ../shakespeare-gui
    cmds:
      - npm run build:lib

  dev:
    desc: Run the app core in the browser with hot reload
    deps: [gui]
    cmds:
      - npm run dev

  build:
    desc: Build the app core into src/gui (Capacitor webDir)
    deps: [gui]
    cmds:
      - npm run build

  cap:sync:
    desc: Build and copy the web app plus plugins into the native projects
    cmds:
      - task: build
      - npx cap sync

  android:
    desc: Build, sync and open the Android project in Android Studio
    cmds:
      - task: build
      - npx cap sync android
      - npx cap open android
