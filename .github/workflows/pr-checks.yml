name: PR Tests & Security Checks

# Runs for PRs opened by people (pull_request) and for PRs opened by the loop itself
# (workflow_dispatch from bos-flow.yml). When everything passes, the PR is merged if
# .github/bos.config.json allows auto-merge for its direction, and the next step starts.

on:
  pull_request:
    branches: [master, development, revision, testing, releasing, rejection]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  context:
    name: Resolve Pull Request
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Read PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          gh pr view "$NUMBER" --json number,baseRefOid,headRefOid,baseRefName,headRefName \
            --jq '"number=\(.number)\nbase_sha=\(.baseRefOid)\nhead_sha=\(.headRefOid)\nbranches=\(.headRefName) → \(.baseRefName)"' \
            | tee -a "$GITHUB_OUTPUT"

  conventions:
    name: Commit Messages & Metadata Sync
    needs: context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.context.outputs.number }}/merge
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install tooling
        run: uv sync --frozen

      - name: Check commit messages (Conventional Commits)
        run: uv run cz check --rev-range "${{ needs.context.outputs.base_sha }}..${{ needs.context.outputs.head_sha }}"

      - name: Check package.json and pyproject.toml match metadata.json
        run: uv run python scripts/sync_metadata.py --check

  android:
    name: Unit Tests & Android Lint
    needs: context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.context.outputs.number }}/merge

      - name: Build web app and prepare Android project
        uses: ./.github/actions/build-web

      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon

  audit:
    name: NPM Security Audit
    needs: context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.context.outputs.number }}/merge

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Audit npm dependencies (fails on critical)
        run: npm audit --audit-level=critical

  auto-merge:
    name: Auto-Merge (per bos.config.json)
    needs: [context, conventions, android, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge if allowed and start the next loop step
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/bos/flow.py automerge "${{ needs.context.outputs.number }}"
