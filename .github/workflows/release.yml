name: Build & Publish Release APK

# Releases start locally: `task bump` (commitizen) bumps metadata.json and friends,
# writes CHANGELOG.md and creates the tag; `git push --follow-tags` then triggers this workflow.
#
# Required secrets for signing (the same key must sign every release, or updates won't install):
#   KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if [ "$TAG_NAME" != "v$VERSION" ]; then
              echo "::error::Tag $TAG_NAME does not match package.json version $VERSION (was the bump synced from metadata.json?)"
              exit 1
            fi
          else
            TAG_NAME="v$VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "Release version: $VERSION (tag: $TAG_NAME)"

      - name: Build web app and prepare Android project
        uses: ./.github/actions/build-web

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing, refusing to publish an unsigned or randomly signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package release APK
        id: prepare_apk
        run: |
          mkdir -p release_assets
          OUTPUT_NAME="release_assets/shakespeare-mobile-${TAG_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUTPUT_NAME"
          echo "apk_path=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
          echo "Packaged APK: $OUTPUT_NAME"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shakespeare-mobile-${{ env.TAG_NAME }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}

      - name: Write release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # cz bump writes "## vX.Y.Z (date)" sections; take the one of this release
          touch release_notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG_NAME" '
              /^## / { if (found) exit; if ($2 == tag) found = 1 }
              found
            ' CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG_NAME" > release_notes.md
          fi
          cat release_notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          body_path: release_notes.md
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          prerelease: ${{ startsWith(env.VERSION, '0.') }}
