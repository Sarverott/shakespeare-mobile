name: Build & Publish Release APK

# Every loop through master is a release (pushed by a person, or dispatched by the loop's auto-merge):
#   1. the version is bumped per .github/bos.config.json "versioning" (PATCH per loop, MINOR on a
#      breaking change); metadata.json, manifests, lockfiles and CHANGELOG.md are updated,
#      committed as "bump: ..." and tagged vX.Y.Z
#   2. the bump commit and tag are pushed to master
#   3. the APK is built with that version, signed, and attached to a GitHub Release
#   4. the loop continues: the PR master → development (back-merge) is opened
#
# Secrets:
#   KEYSTORE_BASE64    base64 of the upload keystore (.jks) — the same key must sign every release
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if this commit is already released
        id: released
        run: |
          if TAG=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            echo "HEAD is already released as $TAG, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        if: steps.released.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing, refusing to publish an unsigned or randomly signed APK."
            exit 1
          fi

      - name: Set up uv
        if: steps.released.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v6

      - name: Bump version, changelog and tag
        if: steps.released.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv sync --frozen
          python3 .github/bos/flow.py bump

          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Push bump commit and tag
        if: steps.released.outputs.skip != 'true'
        run: git push --follow-tags origin HEAD:master

      - name: Build web app and prepare Android project
        if: steps.released.outputs.skip != 'true'
        uses: ./.github/actions/build-web

      - name: Decode signing keystore
        if: steps.released.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"

      - name: Build release APK
        if: steps.released.outputs.skip != 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package release APK
        if: steps.released.outputs.skip != 'true'
        id: prepare_apk
        run: |
          mkdir -p release_assets
          OUTPUT_NAME="release_assets/shakespeare-mobile-${TAG_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUTPUT_NAME"
          echo "apk_path=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
          echo "Packaged APK: $OUTPUT_NAME"

      - name: Upload APK as workflow artifact
        if: steps.released.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shakespeare-mobile-${{ env.TAG_NAME }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}

      - name: Write release notes from CHANGELOG.md
        if: steps.released.outputs.skip != 'true'
        run: |
          # cz bump writes "## vX.Y.Z (date)" sections; take the one of this release
          awk -v tag="$TAG_NAME" '
            /^## / { if (found) exit; if ($2 == tag) found = 1 }
            found
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG_NAME" > release_notes.md
          fi
          cat release_notes.md

      - name: Publish GitHub Release
        if: steps.released.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          body_path: release_notes.md
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(env.VERSION, '0.') }}

      - name: Open back-merge PR master → development
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/bos/flow.py next-pr master
