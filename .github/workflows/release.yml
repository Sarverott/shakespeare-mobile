name: Build & Publish Release APK

# Every merge into master is a release:
#   1. commitizen bumps the version from the commit messages (feat → minor, fix → patch;
#      merges with only chore/ci/docs/... commits get a patch release), updates metadata.json,
#      package.json, pyproject.toml, lockfiles and CHANGELOG.md, commits "bump: ..." and tags vX.Y.Z
#   2. the bump commit and tag are pushed back to master
#   3. the APK is built with that version, signed, and attached to a GitHub Release
#
# Secrets:
#   FLOW_TOKEN         PAT able to push to master (falls back to GITHUB_TOKEN)
#   KEYSTORE_BASE64    base64 of the upload keystore (.jks) — the same key must sign every release
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    # skip the push of our own bump commit, and only release from master
    if: github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'bump:')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FLOW_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing, refusing to publish an unsigned or randomly signed APK."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Bump version, changelog and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv sync --frozen

          set +e
          uv run cz bump --yes --git-output-to-stderr 2> "$RUNNER_TEMP/bump.log"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/bump.log"
          if [ "$rc" -eq 21 ]; then
            echo "No feat/fix commits since the last release, releasing a patch."
            uv run cz bump --yes --increment PATCH --allow-no-commit --git-output-to-stderr
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Push bump commit and tag
        run: git push --follow-tags origin HEAD:master

      - name: Build web app and prepare Android project
        uses: ./.github/actions/build-web

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package release APK
        id: prepare_apk
        run: |
          mkdir -p release_assets
          OUTPUT_NAME="release_assets/shakespeare-mobile-${TAG_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUTPUT_NAME"
          echo "apk_path=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
          echo "Packaged APK: $OUTPUT_NAME"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shakespeare-mobile-${{ env.TAG_NAME }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}

      - name: Write release notes from CHANGELOG.md
        run: |
          # cz bump writes "## vX.Y.Z (date)" sections; take the one of this release
          awk -v tag="$TAG_NAME" '
            /^## / { if (found) exit; if ($2 == tag) found = 1 }
            found
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG_NAME" > release_notes.md
          fi
          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          body_path: release_notes.md
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(env.VERSION, '0.') }}
