name: Build web app and prepare Android project
description: >
  Sets up Node.js, runs scripts/delegated/workflow-gh/build-web.sh (clones shakespeare-gui next to
  this repository, builds the GUI plugin and the app core into src/gui, syncs it into the Android
  project) and sets up JDK 21 for Gradle.

inputs:
  gui-ref:
    description: Branch or tag of Sarverott/shakespeare-gui to build against
    required: false
    default: master

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Build gui plugin and app core, sync into Android project
      shell: bash
      env:
        GUI_REF: ${{ inputs.gui-ref }}
      run: scripts/delegated/workflow-gh/build-web.sh

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
        cache: gradle
